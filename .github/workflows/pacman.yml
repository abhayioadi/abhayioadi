name: Generate pacman animation

on:
  schedule: # execute every 12 hours
    - cron: "0 */12 * * *"

  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: abhayioadi

      - name: Ensure dark fallback exists
        run: |
          if [ -f dist/pacman-contribution-graph-dark.svg ]; then
            echo "Dark Pacman SVG already exists."
          elif [ -f dist/pacman-contribution-graph.svg ]; then
            cp dist/pacman-contribution-graph.svg dist/pacman-contribution-graph-dark.svg
            echo "Created dark fallback SVG from light SVG."
          else
            echo "::warning::Missing dist/pacman-contribution-graph.svg; dark fallback was not created."
          fi

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
